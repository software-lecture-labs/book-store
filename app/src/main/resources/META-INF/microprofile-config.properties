# Defaults that let the WAR start on its own: an in-memory H2 database with the demo data.
# Override them on the server, never in the WAR, for example with environment variables:
#   BOOKSTORE_DB_CLASS_NAME=org.postgresql.ds.PGSimpleDataSource
#   BOOKSTORE_DB_URL=jdbc:postgresql://localhost:5432/bookstore
#   BOOKSTORE_DB_USER=bookstore
#   BOOKSTORE_DB_PASSWORD=...
#   BOOKSTORE_DEMO_DATA=false
bookstore.db.class-name=org.h2.jdbcx.JdbcDataSource
bookstore.db.url=jdbc:h2:mem:bookstore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
bookstore.db.user=sa
bookstore.db.password=
bookstore.demo-data=true

# The resources live in the modules' jars under WEB-INF/lib; Payara scans only WEB-INF/classes for
# the OpenAPI description unless told otherwise (API-4).
mp.openapi.extensions.scan.lib=true

# Uploaded cover images (ADR-0021). Point it at a lasting directory on the server, for example
#   BOOKSTORE_FILES_DIRECTORY=/var/lib/bookstore/files
bookstore.files.directory=${java.io.tmpdir}/bookstore-files

# How often the server hands on order events left in the outbox (ADR-0022).
bookstore.outbox.interval-seconds=30
