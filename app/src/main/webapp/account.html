<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="account.title">Hesabım</title>
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/pages/account.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main>
  <div id="messages"></div>
  <h1 data-i18n="account.heading"></h1>
  <div class="two-columns">
    <div>
      <form id="profile" class="panel">
        <h2 data-i18n="account.profile"></h2>
        <div class="field"><label for="firstName" data-i18n="field.firstName"></label>
          <input id="firstName" name="firstName" required maxlength="100" autocomplete="given-name"></div>
        <div class="field"><label for="lastName" data-i18n="field.lastName"></label>
          <input id="lastName" name="lastName" required maxlength="100" autocomplete="family-name"></div>
        <div class="field"><label for="email" data-i18n="field.email"></label>
          <input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div>
        <div class="actions"><button type="submit" data-i18n="account.save"></button></div>
      </form>

      <form id="password" class="panel">
        <h2 data-i18n="account.password"></h2>
        <div class="field"><label for="currentPassword" data-i18n="account.currentPassword"></label>
          <input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"></div>
        <div class="field"><label for="newPassword" data-i18n="account.newPassword"></label>
          <input id="newPassword" name="newPassword" type="password" required minlength="8" maxlength="200"
                 autocomplete="new-password"></div>
        <p class="hint" data-i18n="register.passwordHint"></p>
        <div class="actions"><button type="submit" data-i18n="account.changePassword"></button></div>
      </form>
    </div>

    <div>
      <section class="panel">
        <h2 data-i18n="account.addresses"></h2>
        <ul id="address-list" class="address-list"></ul>
      </section>

      <form id="new-address" class="panel">
        <h2 data-i18n="account.newAddress"></h2>
        <div class="form-grid">
          <div class="field"><label for="label" data-i18n="field.label"></label>
            <input id="label" name="label" required maxlength="50" data-i18n-placeholder="field.labelHint"></div>
          <div class="field"><label for="recipient" data-i18n="field.recipient"></label>
            <input id="recipient" name="recipient" required maxlength="200" autocomplete="name"></div>
          <div class="field"><label for="phone" data-i18n="field.phone"></label>
            <input id="phone" name="phone" type="tel" required maxlength="20" autocomplete="tel"></div>
          <div class="field"><label for="postalCode" data-i18n="field.postalCode"></label>
            <input id="postalCode" name="postalCode" required pattern="\d{5}" inputmode="numeric" autocomplete="postal-code"></div>
          <div class="field"><label for="district" data-i18n="field.district"></label>
            <input id="district" name="district" required maxlength="100"></div>
          <div class="field"><label for="city" data-i18n="field.city"></label>
            <input id="city" name="city" required maxlength="100" autocomplete="address-level1"></div>
        </div>
        <div class="field"><label for="line" data-i18n="field.line"></label>
          <input id="line" name="line" required maxlength="300" autocomplete="street-address"></div>
        <label class="inline"><input type="checkbox" name="makeDefault"> <span data-i18n="account.makeDefault"></span></label>
        <div class="actions"><button type="submit" data-i18n="account.addAddress"></button></div>
      </form>
    </div>
  </div>
</main>
<footer class="site-footer" data-i18n="site.footer"></footer>
</body>
</html>
