<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="catalog.title">Kitaplar</title>
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/pages/catalog.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main>
  <div id="messages"></div>
  <h1 data-i18n="catalog.heading"></h1>

  <form id="search" class="search panel" role="search">
    <div class="field grow">
      <label for="q" data-i18n="catalog.search"></label>
      <input id="q" name="q" type="search" data-i18n-placeholder="catalog.searchHint">
    </div>
    <div class="field">
      <label for="category" data-i18n="catalog.category"></label>
      <select id="category" name="category"><option value="" data-i18n="catalog.allCategories"></option></select>
    </div>
    <div class="field">
      <label for="language" data-i18n="catalog.language"></label>
      <select id="language" name="language">
        <option value="" data-i18n="catalog.anyLanguage"></option>
        <option value="tr" data-i18n="language.tr"></option>
        <option value="en" data-i18n="language.en"></option>
      </select>
    </div>
    <div class="field">
      <label for="sort" data-i18n="catalog.sort"></label>
      <select id="sort" name="sort">
        <option value="TITLE:asc" data-i18n="catalog.sortTitle"></option>
        <option value="PRICE:asc" data-i18n="catalog.sortPriceUp"></option>
        <option value="PRICE:desc" data-i18n="catalog.sortPriceDown"></option>
        <option value="PUBLICATION_YEAR:desc" data-i18n="catalog.sortNewest"></option>
        <option value="RATING:desc" data-i18n="catalog.sortRating"></option>
      </select>
    </div>
    <div class="actions">
      <label class="inline"><input type="checkbox" name="inStock"> <span data-i18n="catalog.inStockOnly"></span></label>
      <button type="submit" data-i18n="catalog.find"></button>
    </div>
  </form>

  <p id="summary" class="hint" aria-live="polite"></p>
  <ul id="books" class="books"></ul>
  <nav id="pager" class="pager" data-i18n-title="catalog.pages"></nav>
</main>
<footer class="site-footer" data-i18n="site.footer"></footer>
</body>
</html>
