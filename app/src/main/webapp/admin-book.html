<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="admin.bookTitle">Kitap</title>
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/pages/admin-book.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main>
  <nav id="admin-nav" class="tabs" data-i18n-title="admin.heading"></nav>
  <div id="messages"></div>
  <p><a href="admin-books.html" data-i18n="admin.backToBooks"></a></p>
  <h1 id="heading"></h1>
  <div class="two-columns wide-first">
    <form id="book" class="panel">
      <div class="form-grid">
        <div class="field"><label for="isbn" data-i18n="book.isbn"></label>
          <input id="isbn" name="isbn" required maxlength="20" inputmode="numeric"></div>
        <div class="field"><label for="title" data-i18n="admin.bookName"></label>
          <input id="title" name="title" required maxlength="300"></div>
      </div>
      <div class="field"><label for="authorIds" data-i18n="admin.authors"></label>
        <select id="authorIds" name="authorIds" multiple required size="6"></select>
        <span class="hint" data-i18n="admin.authorsHint"></span></div>
      <div class="form-grid">
        <div class="field"><label for="categoryId" data-i18n="book.category"></label>
          <select id="categoryId" name="categoryId" required></select></div>
        <div class="field"><label for="language" data-i18n="book.language"></label>
          <select id="language" name="language" required>
            <option value="tr" data-i18n="language.tr"></option>
            <option value="en" data-i18n="language.en"></option>
            <option value="de" data-i18n="language.de"></option>
            <option value="fr" data-i18n="language.fr"></option>
            <option value="es" data-i18n="language.es"></option>
            <option value="ru" data-i18n="language.ru"></option>
            <option value="xx" data-i18n="language.xx"></option>
          </select></div>
        <div class="field"><label for="publisher" data-i18n="book.publisher"></label>
          <input id="publisher" name="publisher" maxlength="200"></div>
        <div class="field"><label for="publicationYear" data-i18n="book.year"></label>
          <input id="publicationYear" name="publicationYear" type="number" min="1000" max="2100"></div>
        <div class="field"><label for="pageCount" data-i18n="book.pages"></label>
          <input id="pageCount" name="pageCount" type="number" min="0" value="0"></div>
        <div class="field"><label for="price" data-i18n="admin.price"></label>
          <input id="price" name="price" type="number" min="0.01" step="0.01" required></div>
        <div class="field"><label for="stock" data-i18n="admin.stock"></label>
          <input id="stock" name="stock" type="number" min="0" step="1" value="0" required></div>
      </div>
      <div class="field"><label for="description" data-i18n="admin.description"></label>
        <textarea id="description" name="description" rows="5" maxlength="5000"></textarea></div>
      <div class="actions"><button type="submit" data-i18n="account.save"></button></div>
    </form>

    <section id="cover-panel" class="panel" hidden>
      <h2 data-i18n="admin.cover"></h2>
      <div id="cover"></div>
      <form id="cover-form">
        <div class="field"><label for="cover-file" data-i18n="admin.coverFile"></label>
          <input id="cover-file" name="file" type="file" accept="image/jpeg,image/png" required></div>
        <p class="hint" data-i18n="admin.coverHint"></p>
        <div class="actions"><button type="submit" data-i18n="admin.upload"></button></div>
      </form>
      <h2 data-i18n="admin.onSale"></h2>
      <label class="inline"><input id="active" type="checkbox"> <span data-i18n="admin.onSaleLabel"></span></label>
    </section>
  </div>
</main>
<footer class="site-footer" data-i18n="site.footer"></footer>
</body>
</html>
