# Local PostgreSQL 17 for running the application against a real database (ADR-0008).
# Start it with:  docker compose up -d
# The tests do not need it: they use H2, and the PostgreSQL contract tests start their own
# container through Testcontainers when Docker is available.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      # Only for local development; set BOOKSTORE_DB_PASSWORD to override it.
      POSTGRES_PASSWORD: ${BOOKSTORE_DB_PASSWORD:-bookstore}
    ports:
      - "5432:5432"
    volumes:
      - bookstore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bookstore-data:
